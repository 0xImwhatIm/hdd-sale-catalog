name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        run: npm run build

      - name: Move static assets outside Jekyll private paths
        run: |
          asset_dir="$(find dist/client -type d -path '*/_next' -print -quit)"
          test -n "$asset_dir"
          asset_parent="$(dirname "$asset_dir")"
          mv "$asset_dir" "$asset_parent/assets"
          find dist/client -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.rsc' -o -name '_headers' \) \
            -exec perl -pi -e 's#/_next/#/assets/#g' {} +

      - name: Verify static entrypoint
        run: |
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -f dist/client/.nojekyll
          test -n "$(find dist/client -type f -path '*/assets/static/css/*.css' -print -quit)"
          test -n "$(find dist/client -type f -path '*/assets/static/chunks/*.js' -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
